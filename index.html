function aAlmacen(){const T=S.toallas,uso=dentro().a,disp=T.total-uso-T.lav;
 return stop('Almacén','Toallas, sandalias, shorts e insumos')+
 `<div class="grid g4 kpis">${kpi('Toallas disponibles',disp,`de ${T.total} en total`,'towel')}${kpi('Toallas en uso',uso,'una por adulto dentro','users')}${kpi('En lavandería',T.lav,'vuelven limpias al día siguiente','drop')}${kpi('Shorts para venta',S.almacen.find(a=>a.id==='shorts').stock,'se descuentan al venderlos en el registro','box')}</div>
 <div class="row mt mb"><button class="btn sm ghost" data-a="lavRecibir" ${T.lav?'':'disabled'}>Recibir ${T.lav} toallas limpias de lavandería</button></div>
 <div class="card"><div class="tscroll"><table><thead><tr><th>Insumo</th><th class="num">Stock</th><th class="num">Mínimo</th><th style="min-width:120px">Nivel</th><th>Estado</th><th>Ajustar</th></tr></thead><tbody>${S.almacen.map((i,ix)=>`<tr><td><b style="font-weight:500">${i.nombre}</b></td><td class="num">${dec(i.stock)} ${i.u}</td><td class="num">${dec(i.min)} ${i.u}</td><td>${meter(Math.min(1,i.stock/(i.min*2)),'stock')}</td><td>${i.stock<i.min?pill('Comprar','bad'):i.stock<i.min*1.3?pill('Bajo','warn'):pill('OK','ok')}</td><td>${ctr('alm',dec(i.stock),ix+'|',0)}</td></tr>`).join('')}</tbody></table></div></div>`}

/* ---------- mantenimiento ---------- */
function aMant(){const s=U.sub.mant,inc=S.mant.incid.filter(i=>i.estado!=='Resuelta').length;return stop('Mantenimiento y sanidad','Controles de la piscina, temperaturas, limpieza por turno e incidencias')+subtabs('mant',[['piscina','Control de piscina'],['temps','Sauna y vapor'],['limpieza','Limpieza por turno'],['incid','Incidencias',inc]])+({piscina:mPiscina,temps:mTemps,limpieza:mLimp,incid:mIncid})[s]()}
const rbox=(t,v,u,r)=>`<div><div class="xs muted">${t}</div><div class="v" style="color:${rango(v,r)?'var(--ok)':'var(--bad)'}">${dec(v)}<small class="small muted"> ${u}</small></div><div class="r">Rango: ${dec(r[0])} a ${dec(r[1])} ${u}</div></div>`;
function mPiscina(){const L=S.mant.piscina,lp=L[L.length-1],R=S.cfg.rangos,M=U.med;const due=toMin(lp.hora)+120-ahoraMin();
 return `${due<0?`<div class="banner bad">${ic('drop')}<span>Toca medir: la última medición fue a las ${h12(lp.hora)}.</span></div>`:`<div class="banner info">${ic('clock')}<span>Próxima medición a las ${h12(toHM(toMin(lp.hora)+120))}, en ${due} minutos.</span></div>`}
 <div class="split"><div><div class="card"><h3>Última medición · ${h12(lp.hora)} · ${lp.por}</h3><div class="reading">${rbox('Cloro libre',lp.cloro,'ppm',R.cloro)}${rbox('pH',lp.ph,'',R.ph)}${rbox('Temperatura del agua',lp.agua,'°C',R.agua)}</div></div>
 <div class="card mt"><h3>Registro del día</h3><div class="tscroll"><table><thead><tr><th>Hora</th><th class="num">Cloro</th><th class="num">pH</th><th class="num">Agua</th><th>Responsable</th><th>Estado</th></tr></thead><tbody>${[...L].reverse().map(x=>{const ok=rango(x.cloro,R.cloro)&&rango(x.ph,R.ph)&&rango(x.agua,R.agua);return `<tr><td>${h12(x.hora)}</td><td class="num">${dec(x.cloro)} ppm</td><td class="num">${dec(x.ph)}</td><td class="num">${dec(x.agua)} °C</td><td>${x.por}</td><td>${ok?pill('En rango','ok'):pill('Fuera de rango','bad')}</td></tr>`}).join('')}</tbody></table></div></div></div>
 <aside class="card sticky"><h3>Registrar medición</h3><div class="form"><label class="fld">Cloro libre (ppm)<input type="number" step="0.1" data-in="U.med.cloro" data-num value="${M.cloro}"></label><label class="fld">pH<input type="number" step="0.1" data-in="U.med.ph" data-num value="${M.ph}"></label><label class="fld">Temperatura del agua (°C)<input type="number" step="0.5" data-in="U.med.agua" data-num value="${M.agua}"></label><button class="btn" data-a="medir">Guardar medición</button></div></aside></div>`}

function cargarXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok(window.XLSX);const s=document.createElement('script');s.src=XLSX_URL;s.onload=()=>ok(window.XLSX);s.onerror=()=>no(new Error('No se pudo cargar el lector de Excel (revisa la conexión a internet).'));document.head.appendChild(s)})}
/* CSV de Google Sheets («LIBRO - HOJA.csv»): fechas sin año, en día-mes (DIARIO) o mes/día (BAR DIARIO) */
function csvFilas(t,sep=','){const R=[];let row=[],c='',q=false;t=String(t).replace(/^﻿/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);R.push(row);row=[];c=''}else c+=ch}if(c!==''||row.length){row.push(c);R.push(row)}return R}
function csvHojas(nombre,text){const first=String(text).split(/\r?\n/,1)[0];const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';
 const rows=csvFilas(text,sep).map(r=>r.map(v=>String(v).trim()===''?null:v));const re=/^\s*(\d{1,2})[\/\-.](\d{1,2})\s*$/;
 const M=rows.slice(1).map(r=>r&&r[0]!=null&&String(r[0]).match(re)).filter(Boolean);const mesDia=M.some(m=>+m[2]>12)&&!M.some(m=>+m[1]>12);const y0=+HOY.slice(0,4);

/* ---- Izipay: formulario incrustado oficial (la clave secreta queda en el servidor) ---- */
let KRP=null;
function cargarKR(pub){if(KRP)return KRP;KRP=new Promise((ok,no)=>{const B='https://static.micuentaweb.pe/static/js/krypton-client/V4.0/';
 const css=document.createElement('link');css.rel='stylesheet';css.href=B+'ext/classic.css';document.head.appendChild(css);
 const s=document.createElement('script');s.src=B+'stable/kr-payment-form.min.js';s.setAttribute('kr-public-key',pub);s.setAttribute('kr-language','es-ES');s.setAttribute('kr-spa-mode','true');
 s.onload=()=>{const t=document.createElement('script');t.src=B+'ext/classic.js';t.onload=()=>ok(window.KR);t.onerror=()=>ok(window.KR);document.head.appendChild(t)};s.onerror=()=>{KRP=null;no(new Error('no cargó la librería de Izipay'))};document.head.appendChild(s)});return KRP}
function izipayPagar(ctx){const R=U.R,G=U.gift;const monto=ctx==='gift'?valorGiftSel():cotizar(R).total;
 const orden=ctx==='gift'?(G.codigoPre=G.codigoPre||codAzar('REG-')):(R.codigoPre=R.codigoPre||codAzar('HM-'));
 const quien=ctx==='gift'?{nombre:G.de,cel:G.cel,email:''}:{nombre:R.nombre,cel:R.cel,email:R.correo,dni:R.dni};
 const capa=document.createElement('div');capa.className='izi-capa';
 capa.innerHTML=`<div class="izi-caja" role="dialog" aria-modal="true" aria-label="Pago con Izipay"><div class="izi-top"><b>Pagar ${sol(monto)}</b><button type="button" class="izi-x">Cancelar</button></div><p class="izi-msg" role="status">Abriendo el formulario seguro de Izipay…</p><div id="izi-form"><div class="kr-embedded"></div></div><p class="izi-pie">Pago procesado por Izipay. Hammam no ve ni guarda los datos de tu tarjeta.</p></div>`;
 document.body.appendChild(capa);const msg=t=>{const m=capa.querySelector('.izi-msg');if(m)m.textContent=t};
 const cerrar=()=>{try{window.KR&&window.KR.removeForms()}catch(e){}capa.remove()};capa.querySelector('.izi-x').onclick=cerrar;
 fetch(urlServ()+'/pago/crear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orden,monto,tipo:ctx,...quien,borrador:ctx==='reserva'?borradorR():null})})
  .then(r=>r.json()).then(async d=>{if(!d.formToken)throw new Error(d.detalle||d.error||'sin respuesta');
   const KR=await cargarKR(d.publicKey);await KR.setFormConfig({formToken:d.formToken,'kr-language':'es-ES'});
   KR.onError(e=>msg((e&&e.errorMessage)||'No se pudo procesar el pago. Revisa los datos e intenta otra vez.'));
   KR.onSubmit(pd=>{msg('Verificando el pago…');
    fetch(urlServ()+'/pago/validar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientAnswer:pd.rawClientAnswer||JSON.stringify(pd.clientAnswer),hash:pd.hash})})
     .then(r=>r.json()).then(v=>{if(v.ok&&v.estado==='PAID'){cerrar();pagoAprobado(ctx,{medio:'izipay',metodo:v.metodo||'Tarjeta',orden,uuid:v.uuid})}else msg('El pago no fue aprobado. Puedes intentar con otra tarjeta o elegir otro medio.')})
     .catch(()=>msg('No pudimos verificar el pago. Si se cobró, escríbenos por WhatsApp con tu número de operación.'));return false});
   await KR.renderElements('#izi-form');msg('')})
  .catch(e=>{try{console.warn('Izipay',e)}catch(_){}msg('No se pudo abrir el pago con Izipay'+(e&&e.errorCode?' (código '+e.errorCode+')':'')+'. Elige otro medio de pago o escríbenos por WhatsApp.')})}

function crearGiftWeb(info){const G=U.gift;if(!validGift())return null;const sel=GOPTS().find(o=>o[0]===G.tipo);const valor=valorGiftSel();
 const code=G.codigoPre||codAzar('REG-');const conf=info.medio==='izipay'||info.sim;
 const item=Math.max(0,...S.gifts.map(g=>g.item||0))+1;const g={item,codigo:code,comprador:G.de.trim(),monto:valor,saldo:valor,pago:info.medio==='izipay'?'WEB · '+String(info.metodo||'IZIPAY').toUpperCase():MEDIO_TXT[info.medio].toUpperCase(),fecha:HOY,vence:addDays(HOY,S.cfg.giftDias),receptor:G.para.trim(),dni:'',tel:G.cel,desc:G.tipo==='monto'?'Monto libre':sel[1],estado:conf?'VIGENTE':'POR CONFIRMAR',web:true,medio:info.medio,pagadoEl:conf?HOY:null,oper:info.oper||'',uso:null,cel:G.cel,nueva:true};
 S.gifts.push(g);G.codigo=code;log(`Venta de gift card ${code} por ${sol(valor)} desde la web (${MEDIO_TXT[info.medio]}${conf?'':', pago por confirmar'}).`,'Web');
 toast(conf?'Pago aprobado.':'Recibimos tu pedido. Recepción confirma el pago y te enviamos la tarjeta.');return g}

/* el redibujo solo cambia lo que cambió: no cierra listas abiertas, no pierde el foco ni recarga el calendario */
function morph(a,b){
 if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
 if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
 if(a.nodeType!==1)return;
 const act=a===document.activeElement,abierto=a.nodeName==='DETAILS'&&a.open;
 for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
 for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
 if(abierto)a.open=true;
 if(a.nodeName==='IFRAME')return;
 /* el valor elegido se toma ANTES de mover nodos: morphHijos puede pasar opciones de b a a y correr las posiciones */
 const selV=a.nodeName==='SELECT'?(()=>{const o=[...b.options].find(o=>o.hasAttribute('selected'));return o?o.value:''})():null;
 morphHijos(a,b);
 if(a.nodeName==='INPUT'){if(a.type==='checkbox'||a.type==='radio')a.checked=b.hasAttribute('checked');else if(!act){const v=b.getAttribute('value')??'';if(a.value!==v)a.value=v}}
 else if(a.nodeName==='TEXTAREA'){if(!act&&a.value!==b.value)a.value=b.value}
 else if(a.nodeName==='SELECT'&&!act){const i=[...a.options].findIndex(o=>o.value===selV);const j=i<0?0:i;if(a.selectedIndex!==j)a.selectedIndex=j}}
function morphHijos(a,b){const ac=[...a.childNodes],bc=[...b.childNodes];for(let i=0;i<bc.length;i++){if(i<ac.length)morph(ac[i],bc[i]);else a.appendChild(bc[i])}for(let i=bc.length;i<ac.length;i++)ac[i].remove()}

/* aviso de pedido nuevo del bar: sonido, mensaje y, si se activó, notificación de la computadora */
function avisarPedido(L){const b=L[0];const txt=`Locker ${b.cas||'—'}: ${L.map(x=>`${+x.cant||1} × ${titulo(prodNom(x))}`).join(', ')}`;
 try{const C=window.__ac||(window.__ac=new (window.AudioContext||window.webkitAudioContext)());[0,.22].forEach(s=>{const o=C.createOscillator(),g=C.createGain();o.frequency.value=880;o.connect(g);g.connect(C.destination);const t0=C.currentTime+s;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);o.start(t0);o.stop(t0+.2)})}catch(e){}
 toast('Pedido nuevo del bar · '+txt);
 try{if(typeof Notification!=='undefined'&&Notification.permission==='granted'&&document.hidden)new Notification('Pedido nuevo del bar',{body:txt})}catch(e){}}

/* cabecera de la portada: transparente arriba, sólida al bajar */
window.addEventListener('scroll',()=>{const h=document.querySelector('.site-head.over');if(h)h.classList.toggle('scrolled',scrollY>80)},{passive:true});

/* carrusel: las fotos 2 a 5 se piden cuando la página ya terminó de cargar */
window.addEventListener('load',()=>setTimeout(()=>{HERO_OK=1;if(U.view==='cliente'&&U.ctab==='inicio')render()},1200));

/* cancelar una reserva, desde la web o desde recepción: libera cabinas, devuelve la gift card y deja la devolución por hacer */
function cancelarReserva(r,por){const res={gift:0,devolver:0};if(!r||r.estado==='cancelada')return res;r.estado='cancelada';(r.slots||[]).forEach(k=>delete S.agenda[k]);
 if(r.giftCod&&r.giftUso){const g=S.gifts.find(x=>x.codigo===r.giftCod);if(g){g.saldo=r1((g.saldo||0)+r.giftUso);g.estado='VIGENTE';g.uso=null;res.gift=r.giftUso;log(`Se devolvieron ${sol(r.giftUso)} a la gift card ${g.codigo} por la cancelación de ${r.codigo}.`,por)}r.giftUso=0}
 if(r.pagado&&r.total>0){r.devolucion={monto:r.total,estado:'POR DEVOLVER',desde:HOY};res.devolver=r.total}
 log(`Reserva ${r.codigo} cancelada${res.devolver?`; queda por devolver ${sol(res.devolver)}`:''}.`,por);return res}

function pcCuadra(){const P=U.pc;if(!P)return false;const r=S.reservas.find(x=>x.codigo===P.codigo);return !!r&&P.m+P.v===r.adultos&&(P.n||0)===(r.ninos||0)}

/* la sección abierta queda en la dirección de la página (se puede compartir y usar Atrás) */
function syncUrl(){try{const h=U.view==='personal'?'personal':U.ctab;if(location.hash.slice(1)!==h)history.pushState(null,'','#'+h);document.title=U.view==='personal'?'Sistema · Hammam':(U.ctab==='inicio'?'Hammam Wellness Center · Sauna, vapor y masajes en Trujillo':`${TIT_PAG[U.ctab]||'Hammam'} · Hammam Wellness Center`)}catch(e){}}

</script>
