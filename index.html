:root{
  --bg:#F3F0E6;--surface:#FFFDF7;--surface2:#EBE8DB;--surface3:#E2DFD0;
  --ink:#232B1E;--muted:#626A58;--line:#D9D5C4;
  --brand:#4B5D43;--brand-ink:#3B4A34;--sage:#A8B389;--brand-2:#7F926A;--brand-soft:#E4E9D6;--on-brand:#FFFFFF;
  --wood:#A0693F;--wood-soft:#F2E4D6;
  --ok:#3E7D4F;--ok-soft:#DFEEDD;--warn:#94640E;--warn-soft:#F5E9CC;--bad:#A63D32;--bad-soft:#F6DFDA;--info:#3A6A86;--info-soft:#DCE8EF;
  --side:#3F4F38;--side-ink:#EEF2E4;--side-muted:#B5C1A0;--side-hover:#4A5C42;--side-on:#5B6E51;
  --shadow:0 1px 2px rgba(35,43,30,.05),0 10px 30px rgba(35,43,30,.07);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12160F;--surface:#1A2016;--surface2:#232A1E;--surface3:#2B3325;--ink:#ECEFE3;--muted:#A4AD96;--line:#323B2B;
  --brand:#B5C49A;--brand-ink:#CBD7B4;--sage:#8E9C72;--brand-2:#93A77A;--brand-soft:#28321F;--on-brand:#162012;
  --wood:#D7A57E;--wood-soft:#3A2C20;
  --ok:#86C795;--ok-soft:#1E3322;--warn:#E3B860;--warn-soft:#3A3019;--bad:#EE8F84;--bad-soft:#3D2420;--info:#8EC0DD;--info-soft:#1D2D37;
  --side:#161C12;--side-ink:#E3E9D5;--side-muted:#8E9A7C;--side-hover:#1F271A;--side-on:#2C3824;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#12160F;--surface:#1A2016;--surface2:#232A1E;--surface3:#2B3325;--ink:#ECEFE3;--muted:#A4AD96;--line:#323B2B;
  --brand:#B5C49A;--brand-ink:#CBD7B4;--sage:#8E9C72;--brand-2:#93A77A;--brand-soft:#28321F;--on-brand:#162012;
  --wood:#D7A57E;--wood-soft:#3A2C20;
  --ok:#86C795;--ok-soft:#1E3322;--warn:#E3B860;--warn-soft:#3A3019;--bad:#EE8F84;--bad-soft:#3D2420;--info:#8EC0DD;--info-soft:#1D2D37;
  --side:#161C12;--side-ink:#E3E9D5;--side-muted:#8E9A7C;--side-hover:#1F271A;--side-on:#2C3824;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.55}
h1,h2,h3,h4{font-family:'Tenor Sans','Jost',sans-serif;font-weight:400;margin:0;letter-spacing:.01em}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.08}
h2{font-size:clamp(26px,3.4vw,36px);line-height:1.15}
h3{font-size:21px;line-height:1.25;margin-bottom:10px}
h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:20px 0 10px;font-family:'Jost',sans-serif;font-weight:600}
p{margin:0 0 10px}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{color:var(--ink)}
img{max-width:100%;display:block}
.small{font-size:13.5px}.xs{font-size:12px}.muted{color:var(--muted)}
.mt{margin-top:16px}.mt2{margin-top:28px}.mb{margin-bottom:16px}.m0{margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1}
.nowrap{white-space:nowrap}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.center{text-align:center}
.hide{display:none!important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.lg{width:28px;height:28px}
.ic.sm{width:16px;height:16px}

/* barra de demo */
.demobar{background:var(--ink);color:var(--bg);font-size:13px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:7px 16px;justify-content:center}
.demobar b{font-weight:600}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:inherit;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:500;opacity:.8}
.seg button.on{background:var(--bg);color:var(--ink);opacity:1}
.lnk{border:0;background:none;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:.85;padding:2px}
.lnk:hover{opacity:1}

/* marca */
.mark{display:inline-block;width:38px;height:38px;background:var(--brand);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;flex:none}
.mark.white{background:#fff}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:'Tenor Sans',sans-serif;font-weight:400;font-size:23px;letter-spacing:.22em}
.wm small{font-size:9.5px;letter-spacing:.32em;color:var(--muted);margin-top:4px;font-weight:500}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);cursor:pointer;border:0;background:none;padding:0}

/* cabecera sitio */
.site-head{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-head .in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 20px}
.site-nav{display:flex;gap:2px;flex:1;justify-content:center;flex-wrap:wrap}
.site-nav button{border:0;background:none;padding:8px 11px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.site-nav button:hover{color:var(--ink);background:var(--surface2)}
.site-nav button.on{color:var(--brand);background:var(--brand-soft)}
.mnav{display:none}
@media (max-width:980px){
  .site-nav{display:none}
  .site-head .in{justify-content:space-between;padding:10px 16px}
  .mnav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav button{border:1px solid var(--line);background:var(--surface);padding:6px 13px;border-radius:999px;white-space:nowrap;cursor:pointer;font-size:14px}
  .mnav button.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
@media (max-width:560px){.wrap{padding:18px 16px 70px}}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card.flat{box-shadow:none}
.card.pad-lg{padding:28px}
.card h3:first-child{margin-top:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:500;padding:10px 18px;border-radius:999px;cursor:pointer;transition:filter .15s,transform .05s;white-space:nowrap;letter-spacing:.01em}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.soft{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.btn.lg{padding:13px 24px;font-size:16px}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.xs{padding:4px 10px;font-size:12.5px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.wood{background:var(--wood);border-color:var(--wood);color:#fff}
.btn:disabled{opacity:.38;cursor:not-allowed;filter:none;transform:none}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.brand{background:var(--brand-soft);color:var(--brand)}.pill.wood{background:var(--wood-soft);color:var(--wood)}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-2);font-weight:600;margin-bottom:10px}
.note{background:var(--surface2);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--muted);margin-top:14px}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;cursor:pointer;text-align:center;line-height:1.25;min-width:64px}
.chip small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.chip:hover{border-color:var(--brand-2)}
.chip.on{border-color:var(--brand);background:var(--brand);color:var(--on-brand)}
.chip.on small{color:inherit;opacity:.85}
.chip:disabled{opacity:.38;cursor:not-allowed;border-color:var(--line)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.subtabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.subtabs button .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:11.5px;margin-left:6px;text-align:center}
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--brand-2)}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.opt.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.opt .pr{font-family:'Tenor Sans';font-size:20px;color:var(--brand);white-space:nowrap}
.opts{display:grid;gap:10px}
.opts.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.form{display:grid;gap:14px}
.form.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.fld{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.fld input,.fld select,.fld textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;width:100%;font-weight:400}
.fld textarea{min-height:84px;resize:vertical}
.inp.sm{padding:6px 9px;font-size:14px;width:auto}
.inp.num{width:90px;text-align:right}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:2px solid var(--brand-2);outline-offset:1px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer}
.check input{margin-top:4px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.ctr-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ctr-row:last-child{border-bottom:0}
.ctr-row small{display:block;font-size:12.5px;color:var(--muted)}
.ctr{display:inline-flex;align-items:center;gap:10px}
.ctr button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;cursor:pointer;line-height:1;display:grid;place-items:center}
.ctr button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.ctr button:disabled{opacity:.35;cursor:not-allowed}
.ctr b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:var(--brand-2);border-radius:99px;transition:width .3s}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.sel td{background:var(--brand-soft)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.code{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:13px;background:var(--surface2);padding:2px 7px;border-radius:6px;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:14px;margin:12px 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);z-index:80;box-shadow:0 8px 28px rgba(0,0,0,.2)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== web de clientes ===== */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:20px 0 30px}
.hero .lead{font-size:18px;color:var(--muted);max-width:50ch;margin:18px 0 26px}
.hero-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;border-top:1px solid var(--line);padding-top:20px}
.hero-facts b{display:block;font-weight:500;font-size:13px;color:var(--brand-2);letter-spacing:.06em;text-transform:uppercase}
.hero-facts span{font-size:15px}
.hero-media{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:3/4;max-height:620px;justify-self:end;width:100%;max-width:440px;background:var(--surface2)}
.hero-media img{width:100%;height:100%;object-fit:cover}
.hero-media .live{position:absolute;left:14px;right:14px;bottom:14px;background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(8px);border-radius:16px;padding:14px 16px;border:1px solid var(--line)}
.live .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px;font-weight:500}
.zl{margin-top:9px}.zl .zt{display:flex;justify-content:space-between;font-size:13.5px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:26px}.hero-media{justify-self:stretch;max-width:none;aspect-ratio:4/5}.hero-facts{grid-template-columns:1fr 1fr 1fr;gap:10px}.hero-facts span{font-size:13.5px}}
.sec{padding:44px 0 10px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.sec-head p{max-width:60ch;color:var(--muted);margin:8px 0 0}
.feat{display:flex;flex-direction:column;gap:8px}
.feat .ic{color:var(--brand);width:30px;height:30px;stroke-width:1.4}
.feat b{font-family:'Tenor Sans';font-weight:400;font-size:18px}
.feat p{color:var(--muted);font-size:14px;margin:0}
.pkg{display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.pkg .bird{position:absolute;right:-8px;top:-6px;width:92px;height:92px;opacity:.12}
.pkg h3{margin:2px 0 0;font-size:24px}
.pkg ul{list-style:none;padding:0;margin:8px 0;display:grid;gap:5px;font-size:14.5px}
.pkg li{display:flex;gap:8px;align-items:flex-start}
.pkg li .ic{color:var(--brand-2);width:17px;height:17px;margin-top:3px}
.pkg .foot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--line);padding-top:14px;margin-top:auto;gap:10px}
.price{font-family:'Tenor Sans';font-size:30px;color:var(--brand);line-height:1}
.price small{font-family:'Jost';font-size:13px;color:var(--muted)}
.save{font-size:12.5px;color:var(--ok);font-weight:500}
.band{background:var(--brand);color:var(--on-brand);border-radius:24px;padding:34px;display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center;position:relative;overflow:hidden}
.band .mark{position:absolute;right:-30px;bottom:-40px;width:220px;height:220px;background:var(--on-brand);opacity:.08}
.band h2{color:inherit}
.band p{opacity:.88}
.band .eyebrow{color:inherit;opacity:.75}
.band .big{font-family:'Tenor Sans';font-size:44px;line-height:1}
@media (max-width:760px){.band{grid-template-columns:1fr;padding:26px}}
.steps3{counter-reset:s;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.steps3>div{counter-increment:s;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.steps3>div::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:600;margin-bottom:10px}
.quote{font-family:'Tenor Sans';font-size:clamp(22px,3vw,30px);line-height:1.3;text-align:center;max-width:30ch;margin:0 auto}
.quote+p{text-align:center;color:var(--muted);margin-top:12px}
.pricetable td{padding:12px 6px}
.pricetable td.num{font-family:'Tenor Sans';font-size:18px;color:var(--brand)}
.toggle{display:inline-flex;background:var(--surface2);border-radius:999px;padding:4px}
.toggle button{border:0;background:none;padding:8px 18px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.toggle button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.timeline{display:grid;gap:0;counter-reset:t}
.timeline>div{display:grid;grid-template-columns:44px 1fr;gap:12px;padding-bottom:16px;position:relative}
.timeline>div::before{counter-increment:t;content:counter(t);width:32px;height:32px;border-radius:50%;border:1.5px solid var(--brand-2);color:var(--brand);display:grid;place-items:center;font-weight:600;background:var(--surface)}
.timeline>div:not(:last-child)::after{content:"";position:absolute;left:15.5px;top:34px;bottom:2px;width:1.5px;background:var(--line)}
.timeline b{display:block;font-weight:500}
.timeline span{color:var(--muted);font-size:14px}
.site-foot{border-top:1px solid var(--line);margin-top:50px;padding:34px 20px 26px;background:var(--surface)}
.site-foot .in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:26px;font-size:14px}
.site-foot h4{margin-top:0}
.site-foot .lb{display:block;border:0;background:none;padding:3px 0;cursor:pointer;color:var(--ink);text-align:left}

.site-foot .legal{max-width:1200px;margin:24px auto 0;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.librobtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);cursor:pointer;margin-top:8px}
@media (max-width:860px){.site-foot .in{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.site-foot .in{grid-template-columns:1fr}}
.fab{display:none}
@media (max-width:980px){.fab{display:flex;position:fixed;right:16px;bottom:16px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.25)}}

/* reserva */
.res-layout{display:grid;grid-template-columns:1fr 330px;gap:20px;align-items:start}
@media (max-width:900px){.res-layout{grid-template-columns:1fr}}
.stepper{display:flex;gap:6px;margin-bottom:8px}
.stepper span{flex:1;height:4px;border-radius:9px;background:var(--line)}
.stepper span.on{background:var(--brand)}
.steplbl{font-size:12.5px;color:var(--muted);margin-bottom:18px;letter-spacing:.04em}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:24px;border-top:1px solid var(--line);padding-top:18px}

.qr{width:150px;height:150px;margin:16px auto;background:#fff;padding:8px;border-radius:12px;border:1px solid var(--line)}
.gcard{border-radius:20px;background:linear-gradient(135deg,#4B5D43,#6E8060);color:#fff;padding:24px;aspect-ratio:1.6;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;max-width:420px}
.gcard .mark{position:absolute;right:-18px;top:-10px;width:150px;height:150px;opacity:.16;background:#fff}
.gcard .wm small{color:rgba(255,255,255,.75)}
.gcard .val{font-family:'Tenor Sans';font-size:30px}
.faq details{border-bottom:1px solid var(--line);padding:14px 2px}
.faq summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--brand);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{color:var(--muted);margin:10px 0 0}
.rules{counter-reset:r;display:grid;gap:12px;padding:0;margin:0;list-style:none}
.rules li{counter-increment:r;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.rules li::before{content:counter(r);width:32px;height:32px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:600}
.menu-cat{margin-bottom:22px}
.menu-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}

/* grilla de masajes */

.slot.occ.atendido{background:var(--ok-soft)}
.slot.occ.noasistio{background:var(--bad-soft)}

@media (max-width:900px){
  .staff{grid-template-columns:1fr}

:root[data-theme="dark"] .people .d{background:#4A2433;color:#F3C3D3}:root[data-theme="dark"] .people .v{background:#1F3550;color:#BBD5F0}:root[data-theme="dark"] .people .n{background:#4A3F17;color:#F0DC9C}

/* ===== v4: registro diario, caja, base de datos, términos ===== */
.chip.mini{padding:5px 10px;min-width:0;font-size:13px;border-radius:10px}
.chip.mini small{display:inline;margin:0 0 0 4px}
.chip.warnc{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:12.5px}
.nm{font-weight:500}
/* nuevo ingreso */
.ne{border:2px solid var(--brand-2)}
.ne h4{margin:18px 0 8px}
.negrid{display:grid;grid-template-columns:1.1fr 1.6fr 1fr .8fr;gap:12px;margin-top:14px}
.negrid .dni input{font-size:20px!important;letter-spacing:.06em}
.lookup{margin-top:10px;background:var(--ok-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lookup>.ic:first-child{color:var(--ok)}
.lookup.new{background:var(--info-soft)}
.lookup.new>.ic:first-child{color:var(--info)}
.lookup>div{flex-basis:100%}
.nefoot{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.totin{width:130px!important;font-size:22px!important;text-align:right;padding:8px 12px!important}
.sumbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.sumbar>div{padding:4px 12px;border-right:1px solid var(--line)}
.sumbar>div small{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sumbar>div b{font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.sumbar .btn{margin-left:auto}
/* hoja tipo Excel */
.sheet{font-size:13.5px}
.sheet th{position:sticky;top:0;background:var(--surface2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.sheet td{padding-top:7px;padding-bottom:7px}
.sheet tr.g1 td{background:color-mix(in srgb,var(--brand-soft) 45%,transparent)}
.sheet tr.out td{color:var(--muted)}
.sheet tr.out .nm{font-weight:400}
.sheet tr.noop td{color:var(--wood)}
.sheet tfoot td{font-weight:500;border-top:2px solid var(--line);background:var(--surface2)}
.cas{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px}
.cas.d{background:#F4DCE3;color:#8A3550}
.cas.v{background:#D9E6F2;color:#2D5778}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cas.d{background:#4A2732;color:#F1B8C8}:root:not([data-theme="light"]) .cas.v{background:#1F3446;color:#A9CCEA}}
:root[data-theme="dark"] .cas.d{background:#4A2732;color:#F1B8C8}:root[data-theme="dark"] .cas.v{background:#1F3446;color:#A9CCEA}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .inp{width:auto}
/* cuadre */
.cuad{width:100%}
.cuad td{padding:7px 4px;border-bottom:1px solid var(--line)}
.cuad tr.tot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0;font-size:15px}
.mini-k{background:var(--surface2);border-radius:12px;padding:10px 12px}
.mini-k small{display:block;font-size:11.5px;color:var(--muted)}
.mini-k b{font-size:20px;font-weight:500}
/* membresías */
.memb .dots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 8px}
.memb .dots span{width:26px;height:26px;border-radius:50%;border:1px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.memb .dots span.on{background:var(--brand);border:0;color:var(--on-brand)}
/* importar */
.filebtn{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.impbadge{margin:14px 12px 0;font-size:12px;color:var(--side-muted);display:flex;gap:6px;align-items:center}
/* ficha del cliente */
.perfil{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perfil>div{background:var(--surface2);border-radius:10px;padding:8px 11px}
.perfil small{display:block;font-size:11.5px;color:var(--muted)}
.perfil b{font-weight:500;font-size:14px}
.prefrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.prefrow:last-of-type{border-bottom:0}
.optbox{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.optbox b{font-weight:500}
.optc{display:inline-flex;align-items:center;gap:4px;cursor:default}
.optc button{border:0;background:none;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 0 0 4px;opacity:.75}
.optc button:hover{opacity:1}
/* términos: pantalla flotante */
.noanim{animation:none!important}
.tmodal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:min(760px,calc(100% - 24px));background:var(--bg);border-radius:22px;z-index:71;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .2s ease-out;overflow:hidden}
.tmodal-bd{z-index:70}
.tmodal .th{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.tmodal .th .row{gap:8px}
.tmodal .th h3{margin:6px 0 0;font-size:22px}
.tmodal .prog{display:flex;gap:5px;margin-top:12px}
.tmodal .prog i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.tmodal .prog i.on{background:var(--brand)}
.tmodal .tbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 22px 22px;font-size:15px}
.tmodal .tbody ol,.tmodal .tbody ul{padding-left:22px;margin:8px 0}
.tmodal .tbody li{margin:6px 0}
.tmodal .tf{border-top:1px solid var(--line);padding:12px 22px calc(12px + env(safe-area-inset-bottom));background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tmodal .tf .hint{flex-basis:100%;font-size:12.5px;color:var(--muted);margin:0}
.tmodal .tf .btn:last-child{margin-left:auto}
.dress{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.dress>div{border-radius:14px;padding:12px 14px}
.dress .si{background:var(--ok-soft)}
.dress .no{background:var(--bad-soft)}
.dress b{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:4px}
.dress .si b{color:var(--ok)}.dress .no b{color:var(--bad)}
.dress ul{list-style:none;padding:0!important;margin:0!important;font-size:14px}
.dress li{margin:5px 0!important}
.accept{display:grid;gap:10px;margin-top:6px}
.accept label{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:14.5px}
.accept label input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--brand)}
.accept label.req small{color:var(--bad);font-weight:500}
.consok{display:flex;gap:10px;align-items:center;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:11px 14px;margin-top:14px;font-size:14px}
@media (max-width:900px){.negrid{grid-template-columns:1fr 1fr}.perfil{grid-template-columns:1fr}.prefrow{grid-template-columns:1fr}.sumbar>div{border-right:0}.sumbar .btn{margin-left:0}}
@media (max-width:560px){.negrid{grid-template-columns:1fr}.dress{grid-template-columns:1fr}.tmodal{max-height:calc(100% - 16px);width:calc(100% - 16px);border-radius:18px}}
.rlist{padding-left:20px;margin:8px 0}
.rlist li{margin:7px 0}

/* ===== registro diario con aspecto de Excel ===== */
.xl-top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.xl-top h2{font-size:26px;margin-right:6px}
.xl-tot{font-size:14px;background:#FFF2CC;border:1px solid #E6D08A;border-radius:8px;padding:4px 10px}
.xl-tot b{font-weight:700}
.xlwrap{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:14px;align-items:start}
.xl-sheet{background:#fff;border:1px solid #BFBFBF;overflow:auto;max-height:calc(100vh - 210px);box-shadow:0 1px 3px rgba(0,0,0,.06)}
table.xl{border-collapse:collapse;table-layout:fixed;font-family:Arial,'Segoe UI',Helvetica,sans-serif;font-size:13.5px;color:#111;background:#fff}
.xl th,.xl td{border:1px solid #D4D4D4;padding:0;height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.xl .letters th{background:#F2F2F2;color:#5f5f5f;font-weight:400;font-size:12px;height:22px;text-align:center;position:sticky;top:0;z-index:3}
.xl .hdr th{background:#6AA84F;color:#000;font-weight:700;font-size:12.5px;height:42px;line-height:1.15;text-align:center;position:sticky;top:22px;z-index:3;padding:2px 4px;white-space:normal;overflow:visible}
.xl th.rn{background:#F2F2F2;color:#5f5f5f;font-weight:400;font-size:12px;text-align:center;position:sticky;left:0;z-index:2}
.xl thead th.rn{z-index:4}
.xl tbody th.rn[data-a]{cursor:pointer}
.xl tbody th.rn[data-a]:hover{background:#E2EFDA;color:#111}
.xl th.rn.warn{background:#FCE4D6;color:#9C4A00;font-weight:700}
.xl th.rn.warn::after{content:'!';display:inline-block;margin-left:3px;width:14px;height:14px;line-height:14px;border-radius:50%;background:#C65911;color:#fff;font-size:10px}
.xc{display:block;width:100%;height:100%;min-height:32px;border:0;background:transparent;font:inherit;color:#111;padding:0 8px;outline:0;border-radius:0}
.xc::placeholder{color:#9a9a9a}
select.xc{padding:0 2px 0 6px;cursor:pointer;font-size:13px;-webkit-appearance:auto;appearance:auto}
.xl td.num .xc{text-align:right}
.xl td.ro{padding:0 8px;color:#222}
.xl td:focus-within{outline:2px solid #217346;outline-offset:-2px;position:relative;z-index:1;background:#fff}
.xl td.cas-on{background:#C6EFCE}
.xl td.cas-on .xc{font-weight:700}
.xl tr.nueva td{background:#FFF8D9}
.xl tr.nueva th.rn{background:#FFE699;color:#7F6000;font-weight:700}
.xl tr.xempty td{cursor:cell}
.xl td.sal{position:relative}
.xl td.sal.hasbtn .xc{padding-right:30px}
.xnow{position:absolute;right:3px;top:50%;transform:translateY(-50%);border:1px solid #BFBFBF;background:#fff;border-radius:6px;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;color:#217346;padding:0}
.xnow:hover{background:#E2EFDA}
.xl-tabs{display:flex;gap:2px;border:1px solid #BFBFBF;border-top:0;background:#F2F2F2;padding:0 6px;overflow-x:auto}
.xl-tabs button{border:0;background:transparent;font-family:Arial,sans-serif;font-size:12.5px;padding:7px 14px;color:#444;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.xl-tabs button:hover{background:#E6E6E6}
.xl-tabs button.on{background:#fff;color:#217346;font-weight:700;border-bottom-color:#217346}
.xl-help{font-size:13px;color:var(--muted);margin:10px 2px 0;max-width:110ch}
.xl-sum .xl{width:100%}
.xl-sum .xl td{padding:0 8px;height:30px}
.xl-sum .xl td.l{font-weight:700;font-size:12.5px;white-space:normal;line-height:1.2}
.xl-sum .xl td.num{padding:0}
.xl-sum .xl td.num.ro{padding:0 8px}
.xl-sum .xl tr.tot td{background:#FFF2CC;font-weight:700}
.xl-sum .xl tr.ed td.num{background:#fff}
.xl-sum .xl tr.gap td{height:12px;background:#fff}
.xl-sum .xl input.xc{text-align:right}
.xl-sum p{margin-top:8px}

 .staff.compact{grid-template-columns:62px 1fr}

/* cuadros de caja: si no entran al costado, se acomodan lado a lado debajo de la hoja */
.lb-grid>.lb-side{flex:1 1 270px;width:auto;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;align-content:flex-start}
.lb-grid>.lb-side>*{flex:0 0 270px;width:270px;margin:0}
/* DIARIO: filtro, columna NOMBRE fija, grupos, avisos y total al pie */
.lb-filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px}
.lb-filtros .chips{display:flex;gap:6px;flex-wrap:wrap}
.lb-filtros .chip b{font-weight:600;margin-left:4px}
.lb-filtros .inp{max-width:340px;flex:1 1 220px}
.lb-hoja>.lb-filtros:first-child{margin-top:18px}
.lb-diario .xl thead th:nth-child(4){position:sticky;left:36px;top:0;z-index:5}
.lb-diario .xl tbody tr:not(.xl-sum)>td:nth-child(4){position:sticky;left:36px;z-index:1;background:#fff;box-shadow:1px 0 0 #E2E1D8}
.lb-diario .xl tbody tr.nueva>td:nth-child(4){background:#FFFBEF}
.xl tr.g0>th.rn{box-shadow:inset 4px 0 0 var(--t-head,#4B5D43)}
.xl tr.g1>th.rn{box-shadow:inset 4px 0 0 #C9A227}
.xl td.mal{background:#FDF1EA}
.xl td.mal .xc{color:#B4561A}
.xl td.tarde{background:#FFF4D6}
.xl tr.xl-sum td,.xl tr.xl-sum th{background:#F4F6EE;height:36px;font-size:13.5px;color:#3d4636}
.xl tr.xl-sum td{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* inventarios: línea de cuánto queda */
.xl td.niv{position:relative;padding-bottom:6px}
.nivel{position:absolute;left:10px;right:10px;bottom:5px;height:5px;border-radius:5px;background:#ECEDE6;overflow:hidden}
.nivel i{display:block;height:100%;border-radius:5px;background:#6E9150}
.nivel.medio i{background:#D9A23A}
.nivel.bajo i{background:#C0582B}
.lb-h4 .t-bajo{color:#B4561A;text-transform:none;letter-spacing:0}
.lb-h4 .t-medio{color:#9a7a1c;text-transform:none;letter-spacing:0}
/* horario de masajes */
.xl td.hm-no{background:#F6F6F2}
/* ingreso */
.login-1{max-width:380px}
.login-1 .fld{display:block}
.login-1 .inp{width:100%}
.login-btn{width:100%}

.clave-ojo{position:relative}
.clave-ojo .inp{padding-right:48px}
.clave-ojo .ojo{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:grid;place-items:center;border:0;background:none;border-radius:50%;color:#6b7262;cursor:pointer}
.clave-ojo .ojo:hover{background:rgba(75,93,67,.08);color:#2f3a29}
.clave-ojo .ojo .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ===== v10: web de clientes editorial — esquinas rectas, líneas finas, fotos grandes ===== */
.web{--w-paper:#F4EFE6;--w-paper2:#FBF8F2;--w-sand:#EAE3D6;--w-ink:#1B1915;--w-ink2:#5A544C;--w-line:rgba(27,25,21,.15);--w-dark:#14120E;--w-cream:#EDE6D8;--w-gold:#C3A446;--w-gold2:#D9C27C;--w-brown:#2A1A0F;
 --bg:var(--w-paper);--surface:var(--w-paper2);--surface2:var(--w-sand);--line:var(--w-line);--ink:var(--w-ink);--muted:var(--w-ink2);--brand:var(--w-ink);--brand-soft:var(--w-sand);--on-brand:var(--w-paper);
 background:var(--w-paper);color:var(--w-ink);font-family:'Montserrat',system-ui,sans-serif}
.web *,.web *::before,.web *::after{border-radius:0!important}
.web .in{max-width:1240px;margin:0 auto;padding:0 28px}
.web h1,.web h2{font-family:'Italiana',serif;font-weight:400;letter-spacing:.01em;color:inherit}
.web h2{font-size:clamp(34px,4.3vw,58px);line-height:1.04}
.web h3{font-family:'Italiana',serif;font-weight:400;font-size:28px;letter-spacing:.01em}
.web em{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;letter-spacing:0}
.web .lbl,.web .eyebrow{font:500 11px/1.5 'Montserrat',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--w-ink2);margin:0 0 14px}
.web p{line-height:1.75}
/* botones */
.web .btn{font:500 11.5px/1 'Montserrat',sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:16px 26px;background:var(--w-ink);color:var(--w-paper);border:1px solid var(--w-ink);box-shadow:none;gap:10px;height:auto}
.web .btn:hover:not(:disabled){background:var(--w-gold);border-color:var(--w-gold);color:var(--w-ink)}
.web .btn.sm{padding:12px 18px;font-size:11px}
.web .btn.xs{padding:8px 12px;font-size:10.5px}
.web .btn.ghost,.web .btn.linea{background:transparent;color:inherit;border-color:currentColor}
.web .btn.oro{background:var(--w-gold);border-color:var(--w-gold);color:var(--w-ink)}
.web .btn.oro:hover{background:var(--w-paper);border-color:var(--w-paper)}
.web .btn.linea.claro{color:#fff;border-color:rgba(255,255,255,.7)}
.web .btn.linea.claro:hover{background:#fff;color:var(--w-ink)}
.web .w-link{display:inline-flex;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid currentColor;padding:0 0 7px;font:500 11.5px/1 'Montserrat',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:inherit;cursor:pointer}
.web .w-link::after{content:'→';font-size:15px;letter-spacing:0;transition:transform .25s}
.web .w-link:hover::after{transform:translateX(5px)}
.web .w-num{display:block;font:500 11px 'Montserrat',sans-serif;letter-spacing:.3em;color:var(--w-gold);margin-bottom:16px}
.web .w-img{background:#2a2620 center/cover no-repeat}

/* cabecera: logo al centro, menú a los lados */
.web .site-head{position:sticky;top:0;z-index:30;background:var(--w-paper);border-bottom:1px solid var(--w-line);backdrop-filter:none;color:var(--w-ink)}
.web .site-head .in{max-width:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;padding:14px 32px}
.web .site-nav{display:flex;flex:none;gap:28px;align-items:center;flex-wrap:nowrap;justify-content:flex-start}
.web .site-nav.der{justify-content:flex-end}
.web .site-nav button:not(.btn){background:none;border:0;border-bottom:1px solid transparent;padding:6px 0;font:500 11px 'Montserrat',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:inherit;cursor:pointer}
.web .site-nav button:not(.btn):hover,.web .site-nav button.on{background:none;color:inherit;border-bottom-color:currentColor}
.web .site-nav .btn{padding:13px 20px;margin-left:6px}
.web .site-head .logo{color:inherit;justify-self:center}
.web .site-head .logo-h{height:48px}
.web .site-head.over{position:absolute;left:0;right:0;background:transparent;border-bottom-color:rgba(255,255,255,.2);color:#fff}
.web .site-head.over .btn{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.web .site-head.over .btn:hover{background:#fff;color:var(--w-ink)}
.web .site-head.over.scrolled{position:fixed;top:0;background:rgba(20,18,14,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);animation:wBaja .35s ease}
@keyframes wBaja{from{transform:translateY(-100%)}to{transform:none}}
.web.home{position:relative}
@media (max-width:1100px){
 .web .site-head .in{grid-template-columns:auto 1fr;padding:12px 18px}

 .web .mnav button.on{background:none;color:inherit;border-bottom-color:currentColor}
}

function precheckForm(r){const P=U.pc;const ad=P.m+P.v;return `<div class="pcbox"><b>Check-in exprés</b><p class="small muted m0">¿Quiénes vienen? Con esto dejamos tus lockers listos y en recepción solo muestras tu QR.</p>

function histCliente(c){const R=S.diario.filter(r=>!r.anulado&&((c.dni&&r.dni===c.dni)||(c.cel&&r.cel===c.cel)));const by={};R.forEach(r=>{const x=by[r.fecha]||(by[r.fecha]={f:r.fecha,s:new Set(),m:0});x.s.add(r.serv.startsWith('PAQUETE')&&r.paq?paqueteDe(r.paq).nombre:(SERV_CORTO[r.serv]||r.serv));x.m+=(r.total||0)+sum(r.cons||[],k=>k.m)});return Object.values(by).sort((a,b)=>b.f.localeCompare(a.f)).slice(0,12).map(x=>({f:x.f,s:[...x.s].join(', '),m:x.m}))}

const PASOS=['Experiencia','Día y hora','Datos y pago','Listo'];
function cuposIngreso(f,h){const usados=hash(f+h)%16+4+sum(S.reservas.filter(r=>r.fecha===f&&r.hora===h&&r.estado!=='cancelada'&&r.tipo!=='masaje'),r=>r.adultos+r.ninos);return Math.max(0,S.cfg.cap.piscina-usados)}
const adultosR=R=>R.tipo==='paquete'?(R.modal==='dos'?2:1):R.tipo==='masaje'?R.mpers:R.adultos;
function autoMasaje(R){const need=personasMasaje(R);if(!need||!R.fecha)return null;const base=R.tipo==='paquete'&&R.hora?toMin(R.hora):0;const ok=h=>libresEn(R.fecha,h).length>=need&&!pasada(R.fecha,h)&&(R.tipo!=='paquete'||(toMin(h)>=base&&toMin(h)<=base+180));return HORAS_MAS.find(h=>ok(h)&&(R.tipo!=='paquete'||toMin(h)>=base+60))||HORAS_MAS.find(ok)||null}
function validR(){const R=U.R,need=personasMasaje(R);switch(R.paso){
 case 1:return !!R.tipo&&(R.tipo==='circuito'?R.adultos>0:R.tipo==='paquete'?!!R.paq:!!(R.mtipo&&R.mdur));
 case 2:return !!(R.fecha&&(R.tipo==='masaje'?R.mhora:R.hora)&&(need===0||(R.mhora&&libresEn(R.fecha,R.mhora).length>=need)));
 case 3:return R.nombre.trim().length>=3&&/^9\d{8}$/.test(R.cel)&&(R.comp!=='factura'||/^\d{11}$/.test(R.ruc))&&(!!R.pago||cotizar(R).total===0);}return true}
const ctrRow=(t,s,a,v,min,max)=>`<div class="ctr-row"><span>${t}<small>${s}</small></span>${ctr(a,v,'',min,max)}</div>`;
const ninosRow=R=>ctrRow('Niños (menores de 12)',`${sol(S.cfg.precios.nino)} c/u · solo piscina, hasta las ${h12(S.cfg.horario.ninosHasta)}`,'rninos',R.ninos,0,6);
function nextLabel(R){if(R.paso===1)return 'Elegir día y hora';if(R.paso===2)return 'Continuar';if(!R.acepto)return 'Aceptar reglas y continuar';const t=cotizar(R).total;return t===0||R.pago==='local'?'Confirmar reserva':R.pago==='yape'?`Pagar ${sol(t)} con Yape`:`Pagar ${sol(t)}`}
function mbarReserva(){const R=U.R;if(R.paso===4||!R.tipo)return '';const t=cotizar(R).total;return `<div class="mbar"><div class="mtot"><small>Total</small><b>${sol(t)}</b></div><button class="btn" data-a="rnext" data-valid="R" ${validR()?'':'disabled'}>${nextLabel(R)}</button></div>`}
function cReservar(){const R=U.R;if(R.paso===4)return resListo();const c=S.cfg;let b='';
 if(R.paso===1){
  b=`<h2>¿Qué quieres reservar?</h2><div class="xpick mt">${XP().map(([k,t,img,d,p,pre])=>`<button class="${R.tipo===k?'on':''}" data-a="rtipo" data-v="${k}"><div class="im" style="${bgi(img,500,320)}"></div><div class="tx"><b>${t}</b><small>${pre==='desde'?'desde ':''}${sol(p)}${pre==='por persona'?' por persona':''}</small></div></button>`).join('')}</div>`;
  if(R.tipo==='circuito')b+=`<h4>¿Quiénes vienen?</h4>${ctrRow('Adultos',promoDia(R.fecha)?`Promo ${promoTxt()} ese día: cada dos personas pagan ${sol(2*promoCfg().precio)} · toalla, sandalias y locker incluidos`:`${sol(c.precios.circuito)} c/u · toalla, sandalias y locker incluidos · de martes a jueves, promo ${promoTxt()}`,'radultos',R.adultos,1,10)}${ninosRow(R)}`;
  if(R.tipo==='paquete')b+=`<h4>¿Para cuántos?</h4><div class="seg2" style="max-width:360px"><button class="${R.modal==='ind'?'on':''}" data-a="rmodal" data-v="ind">Solo para mí</button><button class="${R.modal==='dos'?'on':''}" data-a="rmodal" data-v="dos">Para dos</button></div><h4>¿Qué masaje?</h4><div class="opts">${c.paquetes.map(p=>`<button class="opt ${R.paq===p.id?'on':''}" data-a="rpaq" data-v="${p.id}"><span><b style="font-weight:500">${p.nombre} · masaje ${MTIPOS[p.masaje].toLowerCase()}</b><small>${MDESC[p.masaje]}</small></span><span class="pr">${sol(R.modal==='dos'?p.dos:p.ind)}</span></button>`).join('')}</div><h4>¿Traes niños?</h4>${ninosRow(R)}`;
  if(R.tipo==='masaje')b+=`<h4>¿Qué masaje?</h4><div class="seg2">${Object.keys(MTIPOS).map(t=>`<button class="${R.mtipo===t?'on':''}" data-a="rmtipo" data-v="${t}">${MTIPOS[t]}</button>`).join('')}</div><p class="small muted mt">${MDESC[R.mtipo]}</p><h4>¿Cuánto tiempo?</h4><div class="chips">${DURS.map(d=>`<button class="chip ${R.mdur===d?'on':''}" data-a="rmdur" data-v="${d}">${d} min<small>${sol(precioMasaje(R.mtipo,d))}</small></button>`).join('')}</div><h4>¿Para cuántos?</h4><div class="seg2" style="max-width:360px">${[1,2].map(n=>`<button class="${R.mpers===n?'on':''}" data-a="rmpers" data-v="${n}">${n===1?'Solo para mí':'Para dos, a la vez'}</button>`).join('')}</div>`;
 }
 if(R.paso===2)b=paso2(R);
 if(R.paso===3)b=paso3(R);
 return `<div class="res-layout"><section class="card pad-lg"><div class="stepper">${PASOS.map((p,i)=>`<span class="${i<R.paso?'on':''}"></span>`).join('')}</div><div class="steplbl">${PASOS.slice(0,3).map((p,i)=>`<b class="${i+1===R.paso?'cur':i+1<R.paso?'past':''}">${i+1}. ${p}</b>`).join('')}</div>${b}
 <div class="navbtns"><button class="btn ghost" data-a="rback" ${R.paso===1?'style="visibility:hidden"':''}>Atrás</button><button class="btn lg" data-a="rnext" data-valid="R" ${validR()?'':'disabled'}>${nextLabel(R)}</button></div></section>${resumenR()}</div>`}
function paso2(R){const need=personasMasaje(R),c=S.cfg,lim=toMin(c.horario.ninosHasta),pers=adultosR(R)+R.ninos;
 let h=`<h2>¿Cuándo vienes?</h2>${dateStrip(proximas(10),R.fecha,'rfecha')}<p class="xs muted">Los lunes no atendemos.</p>`;
 if(!R.fecha)return h+'<p class="note">Elige un día para ver las horas libres.</p>';
 if(R.tipo!=='masaje'){h+=`<h4>Hora de llegada</h4><div class="slots">${HORAS_ING.map(x=>{const cu=cuposIngreso(R.fecha,x),kids=!horaNinosOk(x,R.ninos),pas=pasada(R.fecha,x);const dis=cu<pers||pas||kids;return `<button class="${R.hora===x?'on':''} ${cu>8?'ok':'few'}" data-a="rhora" data-v="${x}" ${dis?'disabled':''}><b>${h12(x)}</b><small>${pas?'ya pasó':kids?'sin niños':cu<pers?'lleno':cu>8?'hay espacio':'quedan '+cu}</small></button>`}).join('')}</div>
  ${R.ninos?`<p class="xs muted mt">Con niños, la llegada es hasta las ${h12(toHM(lim-90))} para que aprovechen la piscina hasta las ${h12(c.horario.ninosHasta)}.</p>`:''}
  ${R.hora&&toMin(R.hora)+c.horario.horas*60>toMin(c.horario.cierra)?`<p class="note warn">Cerramos a las ${h12(c.horario.cierra)}: si llegas a las ${h12(R.hora)}, tu circuito durará ${((toMin(c.horario.cierra)-toMin(R.hora))/60).toLocaleString('es-PE')} horas.</p>`:''}`}
 if(need&&R.tipo==='paquete'&&R.hora){h+=R.mhora?`<div class="chosen"><span>${ic('leaf')} Tu masaje${need>1?' (los dos a la vez)':''} será a las <b>${h12(R.mhora)}</b>${R.hora?`, ${Math.round((toMin(R.mhora)-toMin(R.hora))/5)*5} minutos después de tu llegada`:''}.</span><button class="lnk" data-a="rverMas">${R.verMas?'Listo':'Cambiar'}</button></div>`:'<p class="note bad">No quedan cabinas libres durante tu circuito. Prueba otra hora u otro día.</p>';
  if(R.verMas)h+=masSlots(R,need)}
 if(need&&R.tipo==='masaje')h+=`<h4>Hora del masaje</h4>${masSlots(R,need)}`;
 return h}
function masSlots(R,need){const base=R.tipo==='paquete'&&R.hora?toMin(R.hora):0;return `<div class="slots mt">${HORAS_MAS.map(x=>{const lib=libresEn(R.fecha,x).length,pas=pasada(R.fecha,x),fuera=R.tipo==='paquete'&&(toMin(x)<base||toMin(x)>base+180);const dis=lib<need||pas||fuera;return `<button class="${R.mhora===x?'on':''} ${lib>need?'ok':'few'}" data-a="rmhora" data-v="${x}" ${dis?'disabled':''}><b>${h12(x)}</b><small>${pas?'ya pasó':fuera?'fuera de tu horario':lib<need?'lleno':lib===need?'última cabina':'hay cabinas'}</small></button>`}).join('')}</div>`}
function paso3(R){const q=cotizar(R),localOk=R.tipo==='circuito';const need=personasMasaje(R);
 return `<h2>Tus datos</h2><div class="form cols mt"><label class="fld">Nombre y apellido<input class="bigin" data-in="U.R.nombre" value="${esc(R.nombre)}" autocomplete="name"></label><label class="fld">Celular (ahí te llega tu QR)<input class="bigin" data-in="U.R.cel" data-cel value="${esc(R.cel)}" inputmode="numeric" maxlength="9" placeholder="9xxxxxxxx" autocomplete="tel"></label></div>
 ${need?`<div class="form mt"><label class="fld">¿Algo que la masajista deba saber? (opcional)<input data-in="U.R.notas" value="${esc(R.notas)}" placeholder="Alergias, lesiones, embarazo…"></label></div>`:''}
 <details class="more" ${R.codigoIn||R.comp==='factura'||R.correo?'open':''}><summary>Más opciones: correo, factura o código de descuento</summary><div class="form cols"><label class="fld">Correo<input data-in="U.R.correo" type="email" value="${esc(R.correo)}" autocomplete="email"></label><label class="fld">DNI (para tu boleta)<input data-in="U.R.dni" inputmode="numeric" maxlength="8" value="${esc(R.dni)}"></label></div>
  <div class="row mt"><div class="seg2" style="width:220px"><button class="${R.comp==='boleta'?'on':''}" data-a="rcomp" data-v="boleta">Boleta</button><button class="${R.comp==='factura'?'on':''}" data-a="rcomp" data-v="factura">Factura</button></div>${R.comp==='factura'?`<input class="inp" style="max-width:200px" data-in="U.R.ruc" inputmode="numeric" maxlength="11" value="${esc(R.ruc)}" placeholder="RUC">`:''}</div>
  <div class="row mt mb"><input class="inp" data-in="U.R.codigoIn" value="${esc(R.codigoIn)}" placeholder="Código de descuento o de regalo" style="max-width:260px;text-transform:uppercase"><button class="btn ghost sm" data-a="rcodigo">Aplicar</button><span class="xs muted">Prueba BIENVENIDA10 o REG-4F7K</span></div></details>
 ${R.promo?`<p class="small" style="color:var(--ok);margin:10px 0 0">${ic('check','sm')} Código ${R.promo} aplicado.</p>`:''}${R.gift?`<p class="small" style="color:var(--ok);margin:10px 0 0">${ic('gift','sm')} Tarjeta de regalo ${R.gift} aplicada.</p>`:''}
 <h2 class="mt2">Pago</h2>${q.total>0?`<div class="paytiles mt">${[...mediosPago(),['local','Al llegar',localOk?'Pagas en recepción':'Los masajes se pagan por adelantado']].map(([k,t,d])=>`<button class="${R.pago===k?'on':''}" data-a="rpago" data-v="${k}" ${k==='local'&&!localOk?'disabled':''}><b style="font-weight:500">${t}</b><small class="muted" style="display:block">${d}</small></button>`).join('')}</div>`:'<p class="note ok">Tu tarjeta de regalo cubre todo el monto.</p>'}
 ${R.acepto?`<div class="consok">${ic('check')}<span>Aceptaste las reglas, la vestimenta y el uso de tus datos${R.promos?'; recibirás promociones por WhatsApp':''}. <button class="lnk" data-a="consAbrir" data-v="ver">Volver a leer</button></span></div>`:`<div class="note">${ic('shield','sm')} Antes de confirmar, lee y acepta las reglas de Hammam (convivencia, vestimenta, niños y salud) y el uso de tus datos. Son pasos cortos.</div><button class="btn ghost mt" data-a="consAbrir" data-v="reserva">${ic('book','sm')} Leer y aceptar las reglas</button>`}`}
function resumenR(){const R=U.R;
 if(!R.tipo)return `<aside class="card sum sumph"><div class="ph" style="${bgi('vapor',700,400)}"></div><h3>Tu reserva</h3><p class="small muted">Elige una experiencia para ver el precio.</p><div class="note">${ic('clock','sm')} Martes a domingo, de ${h12(S.cfg.horario.abre)} a ${h12(S.cfg.horario.cierra)}.</div></aside>`;
 const q=cotizar(R);const ad=adultosR(R);const img=R.tipo==='circuito'?'seco':R.tipo==='paquete'?'piedras':'aceite';
 return `<aside class="card sum sumph"><div class="ph" style="${bgi(img,700,400)}"></div><h3>Tu reserva</h3><dl>${R.fecha?`<dt>Día</dt><dd>${R.fecha===HOY?'Hoy':fmtF(R.fecha)}</dd>`:''}${R.hora&&R.tipo!=='masaje'?`<dt>Llegada</dt><dd>${h12(R.hora)}</dd>`:''}${R.mhora?`<dt>Masaje</dt><dd>${h12(R.mhora)}</dd>`:''}${R.hora&&R.tipo!=='masaje'&&toMin(S.cfg.horario.cierra)-toMin(R.hora)<S.cfg.horario.horas*60?`<dt>Duración</dt><dd>${((toMin(S.cfg.horario.cierra)-toMin(R.hora))/60).toLocaleString('es-PE',{maximumFractionDigits:1})} h (cerramos a las ${h12(S.cfg.horario.cierra)})</dd>`:''}<dt>Personas</dt><dd>${ad} adulto${ad>1?'s':''}${R.ninos&&R.tipo!=='masaje'?` · ${R.ninos} niño${R.ninos>1?'s':''}`:''}</dd></dl>
 <div class="lines">${q.L.map(([d,m])=>`<div><span>${d}</span><span class="nowrap">${sol(m)}</span></div>`).join('')||'<div class="muted"><span>Elige una opción</span></div>'}${q.desc?`<div style="color:var(--ok)"><span>Descuento ${R.promo}</span><span>− ${sol(q.desc)}</span></div>`:''}${q.gift?`<div style="color:var(--ok)"><span>Tarjeta de regalo</span><span>− ${sol(q.gift)}</span></div>`:''}</div>
 <div class="tot"><span>Total</span><span class="price">${sol(q.total)}</span></div>${q.total?`<p class="xs muted" style="margin-top:8px">Sumas ${Math.floor(q.total/S.cfg.puntos.porSol)} puntos Colibrí.</p>`:''}</aside>`}
function modalPago(){const R=U.R,t=cotizar(R).total;
 if(R.dlg==='yape')return `<div class="backdrop" data-a="modalCerrar"></div><div class="modal" role="dialog" aria-label="Pagar con Yape"><div class="mh"><b>Pagar ${sol(t)} con Yape</b><button class="btn xs ghost" data-a="modalCerrar" aria-label="Cerrar">${ic('x','sm')}</button></div><ol class="mini"><li>Abre tu app Yape.</li><li>Entra a «Código de aprobación».</li><li>Escribe aquí los 6 números.</li></ol><div class="form"><label class="fld">Celular Yape<input class="bigin" data-in="U.R.yapeCel" data-cel inputmode="numeric" maxlength="9" value="${esc(R.yapeCel||R.cel)}"></label><label class="fld">Código de aprobación<input class="bigin" data-in="U.R.yapeCod" inputmode="numeric" maxlength="6" value="${esc(R.yapeCod)}" placeholder="••••••" autocomplete="one-time-code"></label></div><button class="btn lg block mt" data-a="pagarYape" data-valid="yape" ${/^\d{6}$/.test(R.yapeCod)?'':'disabled'}>Confirmar pago</button><p class="xs muted mt center">Demo: escribe cualquier número de 6 dígitos. En la versión real lo valida la pasarela.</p></div>`;
 return `<div class="backdrop" data-a="modalCerrar"></div><div class="modal" role="dialog" aria-label="Pagar con tarjeta"><div class="mh"><b>Pagar ${sol(t)} con tarjeta</b><button class="btn xs ghost" data-a="modalCerrar" aria-label="Cerrar">${ic('x','sm')}</button></div><p class="small">Aquí se abre el formulario seguro de la pasarela de pagos (Izipay, Culqi, Niubiz o Mercado Pago). Hammam nunca ve ni guarda los datos de tu tarjeta.</p><div class="note">${ic('shield','sm')} Visa · Mastercard · American Express · Diners</div><button class="btn lg block mt" data-a="pagarTarjeta">Simular pago aprobado</button></div>`}
function resListo(){const R=U.R,r=S.reservas.find(x=>x.codigo===R.codigo);if(!r){U.R=newR();return cReservar()}
 return `<div class="center-narrow"><div class="card pad-lg"><div class="done"><div class="okmark">${ic('check','lg')}</div><h2>${r.porConfirmar?'¡Reserva recibida':'¡Listo'}, ${esc(r.nombre.split(' ')[0])}!</h2><p class="muted">${r.porConfirmar?`Tu cupo queda separado. Recepción está verificando tu pago (${esc(r.pago)}) y te confirma por WhatsApp en unos minutos.`:`Tu reserva está confirmada. Te enviamos el código por WhatsApp${R.correo?' y por correo':''} (simulado).`}</p>${qrSVG(r.codigo)}<p>Código <span class="code">${r.codigo}</span></p></div>
 ${resCard(r,true)}
 ${!r.pre?`<div class="note ok">${ic('bolt','sm')} <b>Ahorra la fila:</b> haz tu check-in exprés ahora y en recepción solo muestras este QR.</div>`:''}
 <div class="note">${ic('info','sm')} Trae ropa de baño: es obligatoria para el sauna. La toalla y las sandalias te las damos nosotros.</div>
 <div class="row mt" style="justify-content:center"><button class="btn ghost" data-a="nuevaR">Hacer otra reserva</button><button class="btn ghost" data-a="verPanel" data-v="recepcion">Ver cómo le llega a recepción</button></div></div></div>`}

/* ---------- reglas, vestimenta y datos: la pantalla que el cliente acepta ---------- */
const VEST_SI=['Ropa de baño: bikini o traje de baño en damas; short de baño holgado en varones.','Sandalias puestas en todo momento (te las damos al ingresar).','Toalla para secarte fuera de las cámaras (incluida en el circuito).','Bata, si la deseas (se alquila en recepción).'];
const VEST_NO=['Entrar al sauna sin ropa de baño.','Varones: trajes de baño de licra o prendas muy ceñidas al cuerpo.','Permanecer desnudo en cualquier área del local.','Entrar con toalla a la cámara seca o a la de vapor.','Caminar descalzo.','Entrar a la piscina sin ducharte antes.'];
const regla=(...n)=>`<ul class="rlist">${n.map(i=>`<li><b>Regla ${i}.</b> ${REGLAS[i-1]}</li>`).join('')}</ul>`;
const dressBox=()=>`<div class="dress"><div class="si"><b>${ic('check','sm')} Sí está permitido</b><ul>${VEST_SI.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="no"><b>${ic('x','sm')} No está permitido</b><ul>${VEST_NO.map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`;
function termsSecciones(){const c=S.cfg;return [
 {t:'Convivencia',ic:'users',h:`<p>Con el fin de garantizar una experiencia agradable, segura y armoniosa para todos nuestros visitantes, te pedimos tener en cuenta estas normas:</p>${regla(2,3,5,6)}<p class="small muted">El personal puede pedir que se retire quien no las respete.</p>`},
 {t:'Vestimenta e higiene',ic:'towel',h:`${regla(1,7,8,9,10,12)}${dressBox()}<p class="note">¿No tienes short de baño? En recepción puedes comprar uno (${sol(precioExtra('SHORT'))}) o alquilar un bikini (${sol(precioExtra('BIKINI ALQUILER'))}).</p>`},
 {t:'Niños',ic:'child',h:`<ul class="rlist"><li>Pueden venir niños menores de 12 años, siempre acompañados por un adulto responsable.</li><li>Desde los 12 años pagan la tarifa de adulto (${sol(c.precios.circuito)}).</li><li>Solo usan la piscina, de ${h12(c.horario.abre)} a ${h12(c.horario.ninosHasta)}. No ingresan al sauna seco ni a la cámara de vapor.</li><li>No incluye locker: trae toalla y sandalias para tu menor.</li><li><b>Regla 11.</b> ${REGLAS[10]}</li><li>El adulto responde por el cuidado y la conducta del niño en todo momento.</li></ul>`},
 {t:'Salud y cuidado',ic:'heart',h:`${regla(4)}<ul class="rlist"><li>Si estás embarazada, tienes presión alta, problemas del corazón u otra condición de salud, consulta antes con tu médico y avísanos.</li><li>No uses el sauna ni el vapor si consumiste alcohol. Si te sientes mareado, sal, siéntate y avisa al personal.</li><li>Cuéntanos si tienes alergias o lesiones: la masajista lo verá antes de atenderte.</li><li>Guarda tus objetos de valor en tu locker. Si pierdes la llave, la reposición cuesta ${sol(precioExtra('LLAVE PERDIDA'))}.</li></ul>`},
 {t:'Reservas y pagos',ic:'cal',h:`<ul class="rlist"><li>El circuito dura ${c.horario.horas} horas desde tu ingreso y termina, como máximo, a la hora de cierre (${h12(c.horario.cierra)}).</li><li>Los paquetes y masajes se pagan al reservar para separar la cabina. El circuito también se puede pagar al llegar.</li><li>Puedes cambiar o cancelar tu reserva desde «Mi reserva». (La política de devoluciones la define Hammam.)</li><li>Las tarjetas de regalo valen ${c.giftDias} días desde su compra.</li><li>Recibes boleta o factura electrónica por cada pago.</li></ul>`},
 {t:'Tus datos personales',ic:'shield',h:`<p>Conforme a la Ley 29733, de Protección de Datos Personales, y su reglamento:</p><ul class="rlist"><li><b>Quién los trata:</b> Hammam Wellness Center, Palmas del Golf II, Mz. F Lt. 24, Víctor Larco Herrera (titular: razón social y RUC por confirmar).</li><li><b>Qué datos:</b> nombre, DNI, celular y correo; tus visitas, servicios y consumos; tus preferencias, si nos las das; y las notas de salud que tú nos indiques para tu masaje.</li><li><b>Para qué:</b> registrar tu ingreso y tu locker, gestionar reservas, pagos y comprobantes, atender reclamos y darte tus puntos. Solo te enviamos promociones si lo aceptas aparte.</li><li><b>Con quién:</b> no vendemos tus datos. Solo los usan los proveedores que nos ayudan a operar (pagos, mensajería, sistema), con la misma reserva.</li><li><b>Tus derechos:</b> puedes pedir acceder a tus datos, corregirlos, borrarlos u oponerte a su uso (derechos ARCO), en recepción o a hammamsaunayspa@gmail.com.</li></ul><p class="xs muted">Texto de ejemplo para la demo: Hammam debe revisar la versión final e inscribir su banco de datos.</p>`},

function consentModal(){const C=U.cons;const T=termsSecciones();const n=T.length;const fin=C.paso>=n;const ver=C.ctx==='ver';const sec=T[Math.min(C.paso,n-1)];const visto=!!C.visto[C.paso];

const paqDeCom=c=>/FALAK/i.test(c)?'falak':/NAJAH/i.test(c)?'najah':'salam';

function agendaDeCom(r){const m=r.com.match(/(SALAM|FALAK|NAJAH|MASAJE)\s*-\s*(\d{1,2})(?::(\d{2}))?\s*([AP])\.?\s*M/i);let h=null;if(m){let hh=+m[2];const mm=+(m[3]||0);if(/p/i.test(m[4])&&hh<12)hh+=12;h=toHM(hh*60+mm)}
 if(r.mslot&&(!h||!r.mslot.endsWith('|'+h))){const s=S.agenda[r.mslot];if(s&&s.ticket===r.grp)delete S.agenda[r.mslot];delete r.mslot}
 if(h&&!HORAS_MAS.includes(h)){const c=HORAS_MAS.find(x=>Math.abs(toMin(x)-toMin(h))<=20);if(c)h=c}
 if(h&&!r.mslot&&HORAS_MAS.includes(h)){const cb=libresEn(r.fecha,h)[0];if(!cb){toast(`No hay cabinas libres a las ${h12(h)}.`);return}const solo=/MASAJE/i.test(m[1]);S.agenda[sk(r.fecha,cb,h)]={cliente:titulo(r.nombre),mtipo:solo?(r.mt||'relajante'):paqueteDe(r.paq||paqDeCom(r.com)).masaje,dur:solo?(r.md||45):45,estado:'reservado',origen:'Local',ticket:r.grp,notas:(clienteDni(r.dni)||{}).notas||''};r.mslot=sk(r.fecha,cb,h);toast(`Masaje agendado a las ${h12(h)} en ${cb}.`)}}
function setCampo(r,k,v){const f=r.fecha,hoy=f===HOY;
 if(k==='bar'){if(!v||!hoy||r.sal)return;const p=cartaDe(v);if(!p)return;const b={id:S.seq.barRow=(S.seq.barRow||1)+1,fecha:f,hora:ahora(),cas:r.cas||'',nombre:r.nombre,prod:p.id,cant:1,pago:'NO CANCELO',total:0,por:quien(),diarioId:r.id};recalcBar(b);S.barRows.push(b);syncBar(b);
  log(`Bar: ${p.nombre.toLowerCase()} a la cuenta de ${titulo(r.nombre)}.`);const a=avisoProducto(p,f,1);toast(`${a?a+' ':''}${titulo(p.nombre)} cargado a la cuenta de ${titulo(r.nombre)}: lo paga al salir. Si ya pagó, cámbialo en la hoja BAR.`);return}
 if(k==='ing'||k==='sal'){const h=parseHora(v);if(h===null){toast('Escribe la hora así: 3:10 o 15:10.');return}
  if(k==='sal'){r.sal=h||null;return}
  if(!h)return;r.ing=h;return}
 if(k==='dni'){const d=normDni(v);r.dni=d;const c=d?clienteDni(d):null;if(c){if(!r.nombre||r.nombre==='SIN NOMBRE'||r.auto){r.nombre=String(c.nombre||'').toUpperCase();r.auto=1}if(!r.cel&&c.cel)r.cel=c.cel}else if(d.length>=6&&r.nombre&&r.nombre!=='SIN NOMBRE')nuevoCliente(d,r.nombre,r.cel,{alta:f});return}
 if(k==='nombre'){r.nombre=String(v).trim().toUpperCase();delete r.auto;if(r.dni&&r.dni.length>=6&&!clienteDni(r.dni)&&r.nombre)nuevoCliente(r.dni,r.nombre,r.cel,{alta:f});return}
 if(k==='cel'){const c9=String(v).replace(/\D/g,'').slice(0,9);r.cel=c9;const c=r.dni?clienteDni(r.dni):null;if(c&&!c.cel&&/^9\d{8}$/.test(c9))c.cel=c9;return}
 if(k==='bol'){r.bol=String(v).trim().toUpperCase();const o=r.bol?filasDia(f).find(x=>x!==r&&x.bol===r.bol&&x.grp!==r.grp):null;if(o){r.grp=o.grp;toast(`Misma boleta que ${titulo(o.nombre)}: quedan en la misma cuenta y salen juntos.`)}return}
 if(k==='cas'){const nv=String(v).trim().toUpperCase();if(nv===r.cas)return;if(nv&&hoy){const l=casilleros().find(x=>x.id===nv);if(l&&!casUsable(l)&&!(l.row&&l.row.id===r.id)){toast(`El casillero ${nv} no está libre.`);return}if(l&&l.estado==='reponer'){reponerCas(nv);toast(`Casillero ${nv} marcado como repuesto: déjale su toalla y sus sandalias.`)}}
  const sd=S.almacen.find(a=>a.id==='sandalias');if(sd&&hoy){if(!r.cas&&nv)sd.stock=Math.max(0,sd.stock-1);else if(r.cas&&!nv)sd.stock++}r.cas=nv;return}
 if(k==='serv'){r.serv=v||'SAUNA';r.paq=r.serv.startsWith('PAQUETE')?paqDeCom(r.com):null;if(r.serv==='MASAJE'){r.mt=r.mt||'relajante';r.md=r.md||45}if(r.serv==='PISCINA'&&r.cas)setCampo(r,'cas','');recalc(r);return}
 if(k==='com'){r.com=String(v).trim();if(r.serv.startsWith('PAQUETE'))r.paq=paqDeCom(r.com);if(hoy)agendaDeCom(r);recalc(r);if(esPromo(r)&&!promoCfg().dias.includes(diaSem(f)))toast('Ojo: la promoción 2×100 es de martes a jueves.');return}
 if(k==='ext'){const prev=r.ext||[];const nv=v?String(v).split(' + '):[];const sh=S.almacen.find(a=>a.id==='shorts');if(sh&&hoy){const a=prev.includes('SHORT'),b=nv.includes('SHORT');if(!a&&b)sh.stock=Math.max(0,sh.stock-1);if(a&&!b)sh.stock++}r.ext=nv;recalc(r);return}
 if(k==='pago'){const old=r.pago,nv=v||'EFECTIVO';if(old===nv)return;
  if(nv==='MEMBRESIA'&&!(r.dni&&membActiva(r.dni))){toast(r.dni?'Este DNI no tiene una membresía activa: el pago no cambió.':'Escribe primero el DNI para usar la membresía: el pago no cambió.');return}

  r.pago=nv;r.pagado=nv!=='POR CANCELAR';
  if(nv==='MEMBRESIA'){const m=r.dni?membActiva(r.dni):null;if(m){m.usos.push(f);m.usos.sort();r.membId=m.id;toast(`Membresía: uso ${m.usos.length} de ${m.cupos}.`)}else toast(r.dni?'Este DNI no tiene una membresía activa.':'Escribe primero el DNI para usar la membresía.')}
  if(nv==='GIFT CARD'){const g=giftDe(r.dni);const valor=precioServicio(r);const cubre=Math.min(g.saldo||0,valor);g.saldo=r1((g.saldo||0)-cubre);g.uso=f;if(g.saldo<=0)g.estado='USADO';r.giftCod=g.codigo;r.giftUso=cubre;if(!r.com.includes(g.codigo))r.com=r.com?`${r.com}, ${g.codigo}`:g.codigo;
   if(valor>cubre){(r.cons=r.cons||[]).push({d:`Diferencia no cubierta por la gift card ${g.codigo}`,m:r1(valor-cubre),t:'difgift',pag:false});toast(`La gift card ${g.codigo} cubre ${sol(cubre)}. Quedan ${sol(valor-cubre)} por cobrar en su cuenta.`)}else toast(`Gift card ${g.codigo}: se usaron ${sol(cubre)}${g.saldo>0?`; le quedan ${sol(g.saldo)}`:''}.`)}
  recalc(r);return}
 if(k==='total'){const t=String(v).replace(',','.').replace(/[^\d.]/g,'');if(t===''){delete r.totalManual;recalc(r)}else{r.total=+t;r.totalManual=1}return}}

function produccion(){const f=U.amf,P=S.personal.filter(p=>p.cabina);
 return `<div class="card mt"><h3>Producción de masajistas · ${f===HOY?'hoy':fmtF(f)}</h3><div class="tscroll"><table><thead><tr><th>Masajista</th><th>Cabina</th><th class="num">Atendidos</th><th class="num">Pendientes</th><th class="num">Monto atendido</th><th class="num">Pago según tarifa</th></tr></thead><tbody>${P.map(p=>{const L=HORAS_MAS.map(h=>S.agenda[sk(f,p.cabina,h)]).filter(Boolean);const at=L.filter(s=>s.estado==='atendido');const m=sum(at,s=>precioMasaje(s.mtipo,s.dur));return `<tr><td>${p.nombre}</td><td>${p.cabina}</td><td class="num">${at.length}</td><td class="num">${L.filter(s=>s.estado==='reservado'||s.estado==='en curso').length}</td><td class="num">${sol(m)}</td><td class="num"><b>${sol(sum(at,s=>S.cfg.tarifaMasajista[s.dur]||0))}</b></td></tr>`}).join('')}</tbody></table></div><p class="xs muted">El pago se registra como gasto «MASAJISTA» desde la pantalla de Gastos, igual que en el Excel.</p></div>`}

function aLockers(){const c=countLockers(),all=casilleros(),sel=U.lockerSel?all.find(l=>l.id===U.lockerSel):null;
 return stop('Casilleros',`${c.libre} libres · ${c.ocupado} ocupados · ${c.mant} en mantenimiento · misma numeración que el Excel`)+`<div class="split"><div>${['D','V'].map(sec=>{const L=all.filter(l=>l.sec===sec);return `<div class="card mb"><div class="row between"><h3 class="m0">${sec==='D'?'Damas':'Varones'}</h3><span class="small muted">${L.filter(l=>l.estado==='libre').length} libres de ${L.length}</span></div><div class="lockers mt">${L.map(l=>`<button class="lk ${l.estado} ${U.lockerSel===l.id?'sel':''}" data-a="lk" data-v="${l.id}" aria-label="Casillero ${l.id}, ${l.estado}">${l.id}<small>${l.estado==='ocupado'?esc(titulo(l.row.nombre).split(' ')[0]):l.estado==='mant'?'mant.':''}</small></button>`).join('')}</div></div>`}).join('')}<div class="legend"><span><i class="sw libre"></i>Libre</span><span><i class="sw ocupado"></i>Ocupado</span><span><i class="sw mant"></i>Mantenimiento</span></div></div><aside class="card sticky">${sel?lockerDet(sel):'<p class="empty">Toca un casillero para ver quién lo usa, desde qué hora y su cuenta.</p>'}</aside></div>`}
function lockerDet(l){if(l.estado==='ocupado'){const r=l.row,g=grupoDe(r.grp);const m=ahoraMin()-toMin(r.ing);return `${pill('Ocupado','brand')}${r.perdida?' '+pill('Llave perdida','bad'):''}<div class="big mt">${l.id}</div><dl class="kv"><dt>Cliente</dt><dd>${esc(titulo(r.nombre))}</dd><dt>DNI</dt><dd>${esc(r.dni)||'—'}</dd><dt>Servicio</dt><dd>${SERV_CORTO[r.serv]||r.serv}</dd><dt>Ingresó</dt><dd>${h12(r.ing)}</dd><dt>Tiempo dentro</dt><dd>${Math.floor(m/60)} h ${m%60} min</dd><dt>PIN del bar</dt><dd><span class="code">${g?g.pin:'—'}</span></dd><dt>Grupo por cobrar</dt><dd>${g?sol(pendienteG(g)):'—'}</dd></dl><div class="row"><button class="btn sm" data-a="verCuenta" data-v="${r.grp}">Ver cuenta</button>${r.perdida?'':`<button class="btn sm ghost" data-a="lkPerdida" data-v="${l.id}">Llave perdida</button>`}</div>`}
 if(l.estado==='mant')return `${pill('En mantenimiento','warn')}<div class="big mt">${l.id}</div><p class="small mt">${esc(l.nota||'Sin detalle.')}</p><button class="btn sm" data-a="lkHab" data-v="${l.id}">Habilitar</button>`;
 return `${pill('Libre','ok')}<div class="big mt">${l.id}</div><p class="small muted mt">Se asigna al registrar un ingreso.</p><button class="btn sm ghost" data-a="lkMant" data-v="${l.id}">Poner en mantenimiento</button>`}

 return stop('Aforo por zona','Cada encargado marca desde una tablet o un celular quién entra y quién sale de su zona')+
 `${z.piscina.n?`<div class="banner ${mn<0?'bad':mn<=30?'warn':'info'}">${ic('child')}<span>${z.piscina.n} niño${z.piscina.n>1?'s':''} en la piscina. ${mn<0?'Ya pasó su horario.':`Pueden quedarse hasta las ${h12(c.horario.ninosHasta)} (faltan ${mn} min).`}</span></div>`:''}
 <div class="grid g4 kpis">${kpi('Dentro del local',d.a+d.n,`${d.a} adultos · ${d.n} niños`,'users')}${kpi('En zonas húmedas',enZ,'piscina, sauna y vapor','waves')}${kpi('En masajes',mas,'cabinas en uso ahora','leaf')}${kpi('En vestidores, bar o lounge',Math.max(0,d.a+d.n-enZ-mas),'diferencia calculada','glass')}</div>
 <div class="grid g3 mt">${Object.entries(z).map(([k,x])=>{const t=x.a+x.n,cap=c.cap[k];return `<div class="card"><div class="zh"><h3 class="m0">${ZN[k]}</h3><span class="muted">${t} / ${cap}</span></div>${meter(t/cap)}<div class="zb"><span>Adultos ${ctr('zona',x.a,k+'|a|',0,cap)}</span>${k==='piscina'?`<span>Niños ${ctr('zona',x.n,k+'|n|',0,d.n)}</span>`:''}</div></div>`}).join('')}</div>`}

/* ---------- bar ---------- */
function ventasBar(){let n=0,venta=0,costo=0;S.bar.productos.forEach(p=>{const q=S.bar.ventas[p.id]||0;n+=q;venta+=q*p.precio;costo+=q*costoProd(p)});return {n,venta,costo}}
function aBar(){const s=U.sub.bar,np=S.bar.pedidos.filter(p=>p.estado!=='entregado').length,vb=ventasBar();
 return stop('Bar',`Hoy: ${vb.n} productos · venta ${sol(vb.venta)} · margen ${vb.venta?Math.round((vb.venta-vb.costo)/vb.venta*100):0} %`)+subtabs('bar',[['pos','Vender'],['pedidos','Pedidos',np],['inventario','Inventario en onzas'],['recetas','Recetas y costos'],['compras','Compras'],['cierre','Cierre y merma']])+({pos:barPos,pedidos:barPedidos,inventario:barInv,recetas:barRec,compras:barCompras,cierre:barCierre})[s]()}
function barPos(){const cats=[...new Set(S.bar.productos.map(p=>p.cat))];const lines=Object.entries(U.cart).filter(([k,q])=>q>0);const tot=sum(lines,([k,q])=>prod(k).precio*q);
 return `<div class="split"><div>${cats.map((ct,i)=>`<h4 ${i===0?'style="margin-top:0"':''}>${ct}</h4><div class="prod-grid">${S.bar.productos.filter(p=>p.cat===ct).map(p=>{const low=Object.keys(p.rec).some(k=>insumo(k).stock<insumo(k).min);return `<button class="prod ${low?'low':''}" data-a="cartAdd" data-v="${p.id}"><b>${p.nombre}</b><span>${sol(p.precio)}</span><small>${S.bar.ventas[p.id]||0} vendidos hoy${low?' · poco stock':''}</small></button>`}).join('')}</div>`).join('')}</div>
 <aside class="card sticky"><h3>${ic('cart')} Venta actual</h3>${lines.length?lines.map(([k,q])=>`<div class="cart-line"><span>${prod(k).nombre}</span>${ctr('cartQ',q,k+'|',0,20)}<span class="num">${sol(prod(k).precio*q)}</span></div>`).join(''):'<p class="empty">Toca los productos para agregarlos.</p>'}
 <div class="totline"><span>Total</span><b>${sol(tot)}</b></div>
 <h4>¿Cómo se paga?</h4><div class="chips"><button class="chip ${U.cartDest==='ahora'?'on':''}" data-a="cartDest" data-v="ahora">Paga ahora</button><button class="chip ${U.cartDest==='cuenta'?'on':''}" data-a="cartDest" data-v="cuenta">A la cuenta del casillero</button></div>
 ${U.cartDest==='ahora'?`<div class="chips mt">${MEDIOS.map(m=>`<button class="chip ${U.cartMedio===m?'on':''}" data-a="cartMedio" data-v="${m}">${PAGO_CORTO(m)}</button>`).join('')}</div>`:`<div class="form mt"><select class="inp" data-in="U.cartTicket"><option value="">Elige el casillero…</option>${abiertos().map(g=>`<option value="${g.ticket}" ${String(U.cartTicket)===String(g.ticket)?'selected':''}>${g.lockers.join(', ')||'sin casillero'} · ${esc(g.nombre)}</option>`).join('')}</select></div>`}
 <button class="btn block mt" data-a="cartCobrar" ${lines.length?'':'disabled'}>${U.cartDest==='ahora'?`Cobrar ${sol(tot)}`:'Cargar a la cuenta'}</button><p class="xs muted mt">Cada venta descuenta del inventario las onzas exactas de su receta y entra al cuadre de caja.</p></aside></div>`}
function barPedidos(){const P=[...S.bar.pedidos].sort((a,b)=>b.id-a.id);const col=(e,t)=>`<div><h4 style="margin-top:0">${t}</h4><div class="grid" style="gap:10px">${P.filter(p=>p.estado===e).map(p=>`<div class="order ${e}"><div class="row between"><b style="font-weight:500">#${p.id} · Casillero ${p.locker}</b><span class="xs muted">${h12(p.hora)}</span></div><div class="small muted">${esc(p.nombre)} · desde ${p.origen.toLowerCase()}</div><ul>${p.items.map(([k,q])=>`<li>${prod(k).nombre} × ${q}</li>`).join('')}</ul>${e!=='entregado'?`<button class="btn sm ${e==='nuevo'?'wood':''}" data-a="pedAvanzar" data-v="${p.id}">${e==='nuevo'?'Empezar a preparar':'Marcar entregado'}</button>`:''}</div>`).join('')||'<p class="empty">—</p>'}</div></div>`;
 return `<div class="grid g3">${col('nuevo','Nuevos')}${col('preparando','Preparando')}${col('entregado','Entregados')}</div><p class="note">Los pedidos que los clientes hacen desde su celular aparecen aquí al instante y ya están cargados a la cuenta de su casillero.</p>`}
function barInv(){return `<div class="card"><div class="tscroll"><table><thead><tr><th>Insumo</th><th>Presentación</th><th class="num">Costo</th><th class="num">Stock</th><th style="min-width:130px">Nivel</th><th>Estado</th><th></th></tr></thead><tbody>${S.bar.insumos.map(i=>`<tr><td><b style="font-weight:500">${i.nombre}</b></td><td class="small muted">${i.pres}${i.u==='oz'?` · ${fmtOz(i.cap)} oz`:''}</td><td class="num">${sol2(costoUnit(i))} ${i.u==='oz'?'/ oz':'/ und.'}</td><td class="num">${i.u==='oz'?fmtOz(i.stock)+' oz':i.stock+' und.'}</td><td>${meter(Math.min(1,i.stock/(i.min*2)),'stock')}</td><td>${i.stock<i.min?pill('Reponer','bad'):i.stock<i.min*1.5?pill('Bajo','warn'):pill('OK','ok')}</td><td><button class="btn xs ghost" data-a="reponer" data-v="${i.id}">+ ${i.u==='oz'?'1 botella':'12 und.'}</button></td></tr>`).join('')}</tbody></table></div></div>`}
function barRec(){return `<div class="card"><div class="tscroll"><table><thead><tr><th>Producto</th><th>Receta</th><th class="num">Costo</th><th class="num">Precio</th><th class="num">Margen</th></tr></thead><tbody>${S.bar.productos.map(p=>{const c=costoProd(p);return `<tr><td><b style="font-weight:500">${p.nombre}</b></td><td class="small">${Object.entries(p.rec).map(([k,q])=>{const i=insumo(k);return i.u==='oz'?`${fmtOz(q)} oz ${i.nombre.toLowerCase()}`:`${q} ${i.nombre.toLowerCase()}`}).join(' · ')}</td><td class="num">${sol2(c)}</td><td class="num">${sol2(p.precio)}</td><td class="num"><b>${Math.round((p.precio-c)/p.precio*100)} %</b></td></tr>`}).join('')}</tbody></table></div></div>`}
function barCompras(){const C=U.compra;return `<div class="split"><div class="card"><h3>Compras registradas</h3><div class="tscroll"><table><thead><tr><th>Fecha</th><th>Insumo</th><th class="num">Cantidad</th><th class="num">Total</th><th>Proveedor</th></tr></thead><tbody>${S.bar.compras.map(c=>`<tr><td>${fmtF(c.fecha)}</td><td>${insumo(c.insumo).nombre}</td><td class="num">${c.cant}</td><td class="num">${sol2(c.total)}</td><td class="small muted">${esc(c.prov)}</td></tr>`).join('')}</tbody></table></div></div>
 <aside class="card"><h3>Registrar compra</h3><div class="form"><label class="fld">Insumo<select data-in="U.compra.insumo">${S.bar.insumos.map(i=>`<option value="${i.id}" ${C.insumo===i.id?'selected':''}>${i.nombre}</option>`).join('')}</select></label><label class="fld">Cantidad (botellas o unidades)<input type="number" min="1" data-in="U.compra.cant" data-num value="${C.cant}"></label><label class="fld">Costo total (S/)<input type="number" min="0" step="0.1" data-in="U.compra.total" data-num value="${C.total}"></label><label class="fld">Proveedor<input data-in="U.compra.prov" value="${esc(C.prov)}"></label><button class="btn" data-a="compraGuardar">Registrar compra</button></div><p class="xs muted mt">Suma el stock, actualiza el costo por onza y se anota también como gasto «COMPRAS».</p></aside></div>`}
function difTxt(d,i){if(d===null)return '—';const r=r1(d);return `<span style="color:${r<0?'var(--bad)':'var(--ok)'};font-weight:${r<0?600:400}">${r>0?'+':''}${i.u==='oz'?fmtOz(r)+' oz':r+' und.'}</span>`}
function mermaTot(){let t=0,n=0;S.bar.insumos.forEach(i=>{const v=S.bar.conteo[i.id];if(v!==undefined&&v!==''&&!isNaN(+v)){n++;t+=(+v-i.stock)*costoUnit(i)}});return n?`Diferencia total: ${t<0?'faltan':'sobran'} ${sol2(Math.abs(t))}`:''}
function barCierre(){return `<div class="card"><h3>Conteo físico al cierre</h3><p class="small muted">Al cerrar, el bartender mide lo que queda en cada botella. Si falta más de lo que dicen las ventas, se sirvió de más, se regaló o se vendió sin registrar.</p><div class="tscroll"><table><thead><tr><th>Insumo</th><th class="num">Según sistema</th><th class="num">Conteo físico</th><th class="num">Diferencia</th><th class="num">En soles</th></tr></thead><tbody>${S.bar.insumos.map(i=>{const v=S.bar.conteo[i.id];const d=v===undefined||v===''||isNaN(+v)?null:+v-i.stock;return `<tr><td>${i.nombre}</td><td class="num">${i.u==='oz'?fmtOz(i.stock)+' oz':i.stock+' und.'}</td><td class="num"><input class="inp sm" style="width:84px;text-align:right" data-merma="${i.id}" inputmode="decimal" value="${v??''}" placeholder="—"></td><td class="num" id="md-${i.id}">${difTxt(d,i)}</td><td class="num" id="ms-${i.id}">${d===null?'—':sol2(d*costoUnit(i))}</td></tr>`}).join('')}</tbody></table></div><div class="row mt"><button class="btn" data-a="cierreBar">Guardar cierre del bar</button><span class="small muted" id="merma-tot">${mermaTot()}</span></div></div>`}
